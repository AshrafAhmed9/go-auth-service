syntax = "proto3";

package auth;

option go_package = "github.com/AshrafAhmed9/assignment-golang/proto/authpb";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  uint64 user_id = 2;
  string email = 3;
  string role = 4;
  string error = 5;
}
