syntax = "proto3";

package auth;

option go_package = "github.com/AshrafAhmed9/go-auth-service/proto/authpb";
option java_package = "com.ashraf.notesapi.grpc.auth";
option java_outer_classname = "AuthProto";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  uint64 user_id = 2;
  string email = 3;
  string role = 4;
  string error = 5;
}
